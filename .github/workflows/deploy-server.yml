name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # 安装依赖
      - name: Install dependencies
        working-directory: server
        run: npm ci --production

      # 运行测试
      - name: Run tests
        working-directory: server
        run: npm test 2>/dev/null || echo "No tests configured"

      # 部署到服务器
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # 创建目录
            mkdir -p /opt/maozi-gobang

            # 拉取最新代码
            cd /opt/maozi-gobang
            if [ -d ".git" ]; then
              git pull origin main
            else
              # 首次部署 - 从 GitHub 克隆
              cd /opt
              rm -rf maozi-gobang
              git clone https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git maozi-gobang
              cd maozi-gobang
            fi

            # 安装依赖
            cd /opt/maozi-gobang/server
            npm ci --production

            # 确保 PM2 已安装
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 重启服务
            pm2 reload maozi-gobang --update-env || \
              pm2 start src/index.js --name maozi-gobang -i max --env production

            # 保存 PM2 进程列表
            pm2 save

            echo "部署完成！"
