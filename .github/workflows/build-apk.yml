name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 检查 Flutter 环境
      - name: Flutter doctor
        run: flutter doctor -v

      # 创建 Flutter 项目 (如果不存在)
      - name: Create Flutter project if not exists
        run: |
          if [ ! -d "mobile" ] || [ ! -f "mobile/pubspec.yaml" ]; then
            flutter create --org com.maozi --project-name gobang --platforms android mobile
          fi

      # 配置 Flutter 项目
      - name: Configure Flutter project
        working-directory: mobile
        run: |
          # 添加 WebView 依赖
          flutter pub add webview_flutter
          flutter pub add shared_preferences

      # 设置应用名称和图标
      - name: Apply app name and launcher icons
        run: |
          # 应用名称改为「帽子五子棋」
          MANIFEST=mobile/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="帽子五子棋"/' $MANIFEST
          grep -o 'android:label="[^"]*"' $MANIFEST

          # 用自定义 logo 替换各密度启动图标
          RES=mobile/android/app/src/main/res
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/app-icons/ic_launcher_${dpi}.png $RES/mipmap-${dpi}/ic_launcher.png
          done
          echo "图标已替换"

      # 复制 Web 资源到 Flutter 项目
      - name: Copy web assets
        run: |
          # 构建 web 资源
          mkdir -p mobile/assets/web
          cp -r web/* mobile/assets/web/

      # 创建主页面 (WebView 加载游戏)
      - name: Create main.dart
        working-directory: mobile/lib
        run: |
          cat > main.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'dart:io';

          void main() {
            runApp(const GobangApp());
          }

          class GobangApp extends StatelessWidget {
            const GobangApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '帽子五子棋',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF4A90D9)),
                  useMaterial3: true,
                ),
                home: const GamePage(),
              );
            }
          }

          class GamePage extends StatefulWidget {
            const GamePage({super.key});

            @override
            State<GamePage> createState() => _GamePageState();
          }

          class _GamePageState extends State<GamePage> {
            late final WebViewController _controller;
            bool _isLoading = true;

            // 服务器地址 - 部署后修改此处
            static const String serverUrl = 'http://120.48.13.152:3000';

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (url) {
                      setState(() => _isLoading = false);
                    },
                  ),
                )
                ..loadRequest(Uri.parse(serverUrl));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          DART_EOF

      # 获取依赖
      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      # 构建 APK
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      # 构建 APK (App Bundle 用于 Play Store)
      - name: Build App Bundle
        working-directory: mobile
        run: flutter build appbundle --release

      # 上传 APK 产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gobang-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 上传 AAB 产物
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gobang-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 创建 Release (仅在打标签时)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
